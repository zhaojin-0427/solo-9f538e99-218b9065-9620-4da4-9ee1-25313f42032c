<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}档案馆检索索引{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    font-family: "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f4ef; color: #2b2b2b; line-height: 1.65;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; border-bottom: 3px solid #8a6d3b; padding-bottom: .4rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  nav { margin: .4rem 0 1.2rem; font-size: .95rem; }
  nav a { color: #6f5830; margin-right: 1.2rem; }
  fieldset {
    border: 1px solid #cfc8b8; border-radius: 8px; background: #fffdf8;
    margin: 1.2rem 0; padding: 1rem 1.2rem 1.2rem;
  }
  legend { font-weight: 700; padding: 0 .4rem; }
  label { display: block; margin: .6rem 0; }
  label span { display: inline-block; min-width: 13rem; }
  input[type=file] { font-size: .95rem; }
  input[type=text] {
    font-size: 1rem; padding: .45rem .6rem; border: 1px solid #b9b09c;
    border-radius: 6px; min-width: 22rem;
  }
  button {
    margin-top: .6rem; padding: .6rem 2.2rem; font-size: 1.05rem;
    background: #8a6d3b; color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #6f5830; }
  code, pre {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: #efece3; border-radius: 4px; padding: .1em .35em;
  }
  pre { padding: .8rem 1rem; overflow-x: auto; }
  .panel { border-radius: 8px; padding: 1rem 1.2rem; margin: 1.2rem 0; }
  .error { background: #fbeeec; border: 1px solid #d9a49c; }
  .diff  { background: #fdf3e0; border: 1px solid #dfc27a; }
  .ok    { background: #eef6ea; border: 1px solid #9cc48f; }
  .warn  { background: #fdf3e0; border: 1px solid #dfc27a; }
  .doc { background: #fffdf8; border: 1px solid #cfc8b8; border-radius: 8px; padding: .2rem 1.2rem 1rem; margin-top: 2rem; }
  .doc li { margin: .3rem 0; }
  table { border-collapse: collapse; margin: .8rem 0; }
  th, td { border: 1px solid #c9c2b2; padding: .35rem .9rem; text-align: left; }
  th { background: #efece3; }
  a.btn {
    display: inline-block; margin-top: .6rem; padding: .6rem 1.8rem;
    background: #4a7a3a; color: #fff; text-decoration: none; border-radius: 6px;
    font-size: 1.05rem;
  }
  a.btn:hover { background: #3b6330; }
  a.back { color: #6f5830; }
</style>
</head>
<body>
<main>
  <h1>{% block heading %}档案馆检索索引{% endblock %}</h1>
  <nav>
    <a href="/">核对两套导出</a>
    <a href="/build">制作阅览包</a>
    <a href="/browse">按词阅览</a>
  </nav>
  {% block content %}{% endblock %}
</main>
</body>
</html>
